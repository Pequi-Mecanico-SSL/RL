[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"


[project]
name = "Pequi_SSL-EL_RL"
dynamic = ["version"]
dependencies = [
  "gym==0.21.0",
  "pyglet==1.5.27",
  "protobuf==4.25.0",
  "numpy==1.24.4",
  "gymnasium==0.28.1",
  "tensorboard==2.14.0",
  "opencv-python==4.10.0.84",
  "tqdm==4.66.5",
  "ray[rllib]==2.10.0",
  "moviepy==1.0.3",
  "dill==0.3.9",
  "pyarrow==20.0.0",
  "scipy==1.17.0",
  "debugpy",
  "rsoccer-gym @ git+https://github.com/Pequi-Mecanico-SSL/rSim.git"
]