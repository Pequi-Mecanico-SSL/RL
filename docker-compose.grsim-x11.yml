# grSim com janela nativa via X11 do host + policy (blue) + policy (yellow).
#
# Uso:
#   xhost +local:docker
#   docker compose -f docker-compose.grsim-x11.yml up -d --build
#   # janela do grSim aparece no seu desktop
#   docker compose -f docker-compose.grsim-x11.yml down
#
# Requer: servidor X11 no host (Linux), DISPLAY definido.

services:
  grsim:
    image: robocupssl/grsim:latest
    container_name: grsim_simulator
    network_mode: host
    runtime: nvidia
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/root/.Xauthority:ro
    # Sem 'command: vnc' -> entrypoint usa headless por padrao.
    # Aqui sobrescrevemos para rodar com janela X11.
    entrypoint: ["/usr/local/bin/grSim"]
    restart: unless-stopped

  rl-policy:
    build:
      context: .
      dockerfile: Dockerfile.policy
    image: rl-rl-policy:latest
    container_name: rl_policy_deploy
    depends_on:
      - grsim
    network_mode: host
    volumes:
      - ./volumes/dgx_checkpoints:/checkpoints:ro
      - ./scripts:/app/scripts:ro
      - ./observations.py:/app/observations.py:ro
      - ./rewards.py:/app/rewards.py:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./deploy_policy_grsim.py:/app/deploy_policy_grsim.py:ro
      - ./logs:/app/logs
    environment:
      - CHECKPOINT_PATH=${CHECKPOINT_PATH:-/checkpoints/PPO_selfplay_rec/PPO_Soccer_baseline_2025-03-16/checkpoint_000003}
      - TEAM=blue
      - GRSIM_HOST=127.0.0.1
      - GRSIM_PORT=20011
      - VISION_PORT=10020
      - VISION_ADDRESS=224.5.23.2
      - FPS=30
      - DEVICE=cpu
      - LOG_LEVEL=INFO
      - N_ROBOTS_BLUE=3
      - N_ROBOTS_YELLOW=3
      - FIELD_TYPE=1
    working_dir: /app
    command: python deploy_policy_grsim.py
    restart: on-failure:3

  rl-policy-yellow:
    image: rl-rl-policy:latest
    container_name: rl_policy_deploy_yellow
    depends_on:
      - grsim
      - rl-policy
    network_mode: host
    volumes:
      - ./volumes/dgx_checkpoints:/checkpoints:ro
      - ./scripts:/app/scripts:ro
      - ./observations.py:/app/observations.py:ro
      - ./rewards.py:/app/rewards.py:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./deploy_policy_grsim.py:/app/deploy_policy_grsim.py:ro
      - ./logs:/app/logs
    environment:
      - CHECKPOINT_PATH=${CHECKPOINT_PATH:-/checkpoints/PPO_selfplay_rec/PPO_Soccer_baseline_2025-03-16/checkpoint_000003}
      - TEAM=yellow
      - GRSIM_HOST=127.0.0.1
      - GRSIM_PORT=20011
      - VISION_PORT=10020
      - VISION_ADDRESS=224.5.23.2
      - FPS=30
      - DEVICE=cpu
      - LOG_LEVEL=INFO
      - N_ROBOTS_BLUE=3
      - N_ROBOTS_YELLOW=3
      - FIELD_TYPE=1
    working_dir: /app
    command: python deploy_policy_grsim.py
    restart: on-failure:3
