# Docker Compose para pipeline grSim + RL Policy em modo headless.
#
# Override do checkpoint:
#   CHECKPOINT_PATH=/checkpoints/PPO_selfplay_rec/<exp>/<checkpoint_NNNNNN> ./start_policy.sh

services:
  # Servico do simulador grSim (headless, sem GUI/VNC)
  grsim:
    image: robocupssl/grsim:latest
    container_name: grsim_simulator
    network_mode: host
    volumes:
      - ./grsim.division-b.xml:/home/default/.grsim.xml:ro
    healthcheck:
      test: ["CMD", "pgrep", "grSim"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Servico de deploy da policy RL para time AZUL
  rl-policy:
    build:
      context: .
      dockerfile: Dockerfile.policy
    container_name: rl_policy_deploy
    depends_on:
      grsim:
        condition: service_started
    # Usar host network para receber multicast do SSL-Vision
    network_mode: host
    volumes:
      - ./volumes/dgx_checkpoints:/checkpoints:ro
      - ./scripts:/app/scripts:ro
      - ./observations.py:/app/observations.py:ro
      - ./rewards.py:/app/rewards.py:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./deploy_policy_grsim.py:/app/deploy_policy_grsim.py:ro
      - ./logs:/app/logs
    environment:
      # Override no shell: CHECKPOINT_PATH=... ./start_policy.sh
      - CHECKPOINT_PATH=${CHECKPOINT_PATH:-/checkpoints/PPO_selfplay_rec/PPO_Soccer_baseline_2025-03-16/checkpoint_000002}
      - TEAM=blue
      - ACTION_MODE=${ACTION_MODE:-sample}
      - ACTION_SEED=${ACTION_SEED_BLUE:-150}
      - EPISODE_RESET=${EPISODE_RESET:-1}
      - KICKOFF_MASTER=1
      - CUDA_VISIBLE_DEVICES=
      - GRSIM_HOST=127.0.0.1
      - GRSIM_PORT=20011
      - VISION_PORT=10020
      - VISION_ADDRESS=224.5.23.2
      - FPS=30
      - MATCH_TIME=40
      - VISION_STALE_TIMEOUT=0.25
      - DEVICE=cpu
      - LOG_LEVEL=INFO
      - N_ROBOTS_BLUE=3
      - N_ROBOTS_YELLOW=3
      - FIELD_TYPE=1
    working_dir: /app
    command: python deploy_policy_grsim.py
    stop_grace_period: 5s
    restart: on-failure:3

  # Servico de deploy da policy RL para time AMARELO
  rl-policy-yellow:
    build:
      context: .
      dockerfile: Dockerfile.policy
    container_name: rl_policy_deploy_yellow
    depends_on:
      grsim:
        condition: service_started
      rl-policy:
        condition: service_started
    # Usar host network para receber multicast do SSL-Vision
    network_mode: host
    volumes:
      - ./volumes/dgx_checkpoints:/checkpoints:ro
      - ./scripts:/app/scripts:ro
      - ./observations.py:/app/observations.py:ro
      - ./rewards.py:/app/rewards.py:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./deploy_policy_grsim.py:/app/deploy_policy_grsim.py:ro
      - ./logs:/app/logs
    environment:
      # Override no shell: CHECKPOINT_PATH=... ./start_policy.sh
      - CHECKPOINT_PATH=${CHECKPOINT_PATH:-/checkpoints/PPO_selfplay_rec/PPO_Soccer_baseline_2025-03-16/checkpoint_000002}
      - TEAM=yellow
      - ACTION_MODE=${ACTION_MODE:-sample}
      - ACTION_SEED=${ACTION_SEED_YELLOW:-1150}
      - EPISODE_RESET=${EPISODE_RESET:-1}
      - KICKOFF_MASTER=0
      - CUDA_VISIBLE_DEVICES=
      - GRSIM_HOST=127.0.0.1
      - GRSIM_PORT=20011
      - VISION_PORT=10020
      - VISION_ADDRESS=224.5.23.2
      - FPS=30
      - MATCH_TIME=40
      - VISION_STALE_TIMEOUT=0.25
      - DEVICE=cpu
      - LOG_LEVEL=INFO
      - N_ROBOTS_BLUE=3
      - N_ROBOTS_YELLOW=3
      - FIELD_TYPE=1
    working_dir: /app
    command: python deploy_policy_grsim.py
    stop_grace_period: 5s
    restart: on-failure:3

  # Servico opcional para visualizacao de logs
  log-viewer:
    image: alpine:latest
    container_name: grsim_log_viewer
    volumes:
      - ./logs:/logs:ro
    command: tail -f /logs/policy.log
    profiles:
      - logs
    depends_on:
      - rl-policy
    network_mode: host
