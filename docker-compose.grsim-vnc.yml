# Docker Compose para pipeline grSim + RL Policy com VNC (modo network host)
# Esta versão usa network_mode: host para melhor performance UDP/multicast
# O VNC é acessível pelo IP da máquina host na porta 5900
#
# Para visualizar o grSim:
#   1. Inicie a pipeline: docker-compose -f docker-compose.grsim-vnc.yml up --build
#   2. Descubra o IP da máquina: ip addr show
#   3. Conecte um VNC viewer em <IP_DA_MAQUINA>:5900 (ex: 192.168.1.100:5900)
#   4. Senha VNC (opcional): robocup
#
# Vantagens desta versão:
#   - UDP multicast funciona perfeitamente (vision 224.5.23.2:10002)
#   - Menor latência na comunicação
#   - Melhor para produção/competição
#
# Desvantagens:
#   - Precisa descobrir IP da máquina para conectar VNC
#   - VNC acessível na rede (menos seguro)
#   - Portas não mapeadas (usam portas do host diretamente)

version: '3.8'

services:
  # Servico do simulador grSim com VNC (modo network host)
  grsim:
    image: robocupssl/grsim:latest
    container_name: grsim_simulator
    # Comando "vnc" ativa o modo VNC na imagem oficial
    command: vnc
    # Network host para UDP multicast funcionar
    network_mode: host
    environment:
      # Senha opcional para VNC (comente para sem senha)
      - VNC_PASSWORD=robocup
      # Resolucao do VNC (ajuste conforme sua tela)
      - VNC_GEOMETRY=1920x1080
      # Configuracoes de profundidade de cor
      - VNC_DEPTH=24
    # Sem mapeamento de portas em network_mode: host
    # VNC acessivel em: <IP_DO_HOST>:5900
    # Ports UDP usadas diretamente do host:
    #   - 20011/udp (comandos)
    #   - 10002/udp (vision multicast)
    healthcheck:
      test: ["CMD", "pgrep", "grSim"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Servico de deploy da policy RL (tambem em network host)
  rl-policy:
    build:
      context: .
      dockerfile: Dockerfile.policy
    container_name: rl_policy_deploy
    depends_on:
      grsim:
        condition: service_started
    # Network host para comunicacao UDP com grSim
    network_mode: host
    volumes:
      # Montar checkpoints como read-only
      - ./volumes/dgx_checkpoints:/checkpoints:ro
      # Montar scripts (read-only)
      - ./scripts:/app/scripts:ro
      # Montar arquivos de configuracao e dependencias
      - ./observations.py:/app/observations.py:ro
      - ./rewards.py:/app/rewards.py:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./deploy_policy_grsim.py:/app/deploy_policy_grsim.py:ro
      # Diretorio para logs (read-write)
      - ./logs:/app/logs
    environment:
      # Override no shell: CHECKPOINT_PATH=... (paridade com docker-compose.grsim.yml)
      # Default = checkpoint operacional da campanha 2 (iter235, gate grSim 2026-08-15)
      - CHECKPOINT_PATH=${CHECKPOINT_PATH:-/checkpoints/PPO_selfplay_rec/campaign2_iter235/checkpoint_000003}
      - TEAM=blue
      # mean (deterministic) e o modo validado pela decisao H2
      - ACTION_MODE=${ACTION_MODE:-mean}
      - ACTION_SEED=${ACTION_SEED_BLUE:-150}
      - EPISODE_RESET=${EPISODE_RESET:-1}
      - KICKOFF_MASTER=1
      - CUDA_VISIBLE_DEVICES=
      - GRSIM_HOST=127.0.0.1
      - GRSIM_PORT=20011
      - VISION_PORT=10020
      - VISION_ADDRESS=224.5.23.2
      - FPS=30
      - MATCH_TIME=40
      - VISION_STALE_TIMEOUT=0.25
      - DEVICE=cpu
      - LOG_LEVEL=INFO
      - N_ROBOTS_BLUE=3
      - N_ROBOTS_YELLOW=3
      - FIELD_TYPE=1
    working_dir: /app
    command: python deploy_policy_grsim.py
    stop_grace_period: 5s
    restart: on-failure:3

  # Servico de deploy da policy RL para time AMARELO (paridade com o compose principal)
  rl-policy-yellow:
    build:
      context: .
      dockerfile: Dockerfile.policy
    container_name: rl_policy_deploy_yellow
    depends_on:
      grsim:
        condition: service_started
      rl-policy:
        condition: service_started
    network_mode: host
    volumes:
      - ./volumes/dgx_checkpoints:/checkpoints:ro
      - ./scripts:/app/scripts:ro
      - ./observations.py:/app/observations.py:ro
      - ./rewards.py:/app/rewards.py:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./deploy_policy_grsim.py:/app/deploy_policy_grsim.py:ro
      - ./logs:/app/logs
    environment:
      # Override so da yellow: CHECKPOINT_PATH_YELLOW=... (cai no CHECKPOINT_PATH se ausente)
      - CHECKPOINT_PATH=${CHECKPOINT_PATH_YELLOW:-${CHECKPOINT_PATH:-/checkpoints/PPO_selfplay_rec/campaign2_iter235/checkpoint_000003}}
      - TEAM=yellow
      - ACTION_MODE=${ACTION_MODE:-mean}
      - ACTION_SEED=${ACTION_SEED_YELLOW:-1150}
      - EPISODE_RESET=${EPISODE_RESET:-1}
      - KICKOFF_MASTER=0
      - CUDA_VISIBLE_DEVICES=
      - GRSIM_HOST=127.0.0.1
      - GRSIM_PORT=20011
      - VISION_PORT=10020
      - VISION_ADDRESS=224.5.23.2
      - FPS=30
      - MATCH_TIME=40
      - VISION_STALE_TIMEOUT=0.25
      - DEVICE=cpu
      - LOG_LEVEL=INFO
      - N_ROBOTS_BLUE=3
      - N_ROBOTS_YELLOW=3
      - FIELD_TYPE=1
    working_dir: /app
    command: python deploy_policy_grsim.py
    stop_grace_period: 5s
    restart: on-failure:3

  # Servico opcional para visualizacao de logs
  log-viewer:
    image: alpine:latest
    container_name: grsim_log_viewer
    volumes:
      - ./logs:/logs:ro
    command: tail -f /logs/policy.log
    profiles:
      - logs
    depends_on:
      - rl-policy
