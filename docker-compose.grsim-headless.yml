# Docker Compose para pipeline grSim + RL Policy (modo headless)
# Este arquivo orquestra o simulador grSim sem GUI (modo headless)
# Use quando nao precisar de visualizacao ou para treinamento em background
#
# Para visualizar o grSim, use:
#   - docker-compose.grsim.yml       : Modo VNC com rede bridge
#   - docker-compose.grsim-vnc.yml   : Modo VNC com network host

version: '3.8'

services:
  # Servico do simulador grSim (modo headless - sem GUI)
  grsim:
    image: robocupssl/grsim:latest
    container_name: grsim_simulator
    # Usar network host para multicast UDP funcionar corretamente
    network_mode: host
    # Sem variaveis de ambiente para GUI/VNC
    healthcheck:
      test: ["CMD", "pgrep", "grSim"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Servico de deploy da policy RL
  rl-policy:
    build:
      context: .
      dockerfile: Dockerfile.policy
    container_name: rl_policy_deploy
    depends_on:
      grsim:
        condition: service_started
    # Usar network host para comunicacao UDP com grSim
    network_mode: host
    volumes:
      # Montar checkpoints como read-only
      - ./volumes/dgx_checkpoints:/checkpoints:ro
      # Montar scripts (read-only)
      - ./scripts:/app/scripts:ro
      # Montar arquivos de configuracao e dependencias
      - ./observations.py:/app/observations.py:ro
      - ./rewards.py:/app/rewards.py:ro
      - ./config.yaml:/app/config.yaml:ro
      # Diretorio para logs (read-write)
      - ./logs:/app/logs
    environment:
      # Caminho do checkpoint (ajustar conforme necessario)
      - CHECKPOINT_PATH=/checkpoints/PPO_selfplay_rec/PPO_Soccer_baseline_2025-03-16/checkpoint_000003
      # Time a controlar (blue ou yellow)
      - TEAM=blue
      # Host do grSim (localhost quando usando network_mode: host)
      - GRSIM_HOST=127.0.0.1
      # Porta de comandos do grSim
      - GRSIM_PORT=20011
      # Porta de vision do grSim
      - VISION_PORT=10002
      # Endereco multicast de vision
      - VISION_ADDRESS=224.5.23.2
      # Frames por segundo (deve bater com o treinamento)
      - FPS=30
      # Dispositivo para PyTorch (cpu ou cuda)
      - DEVICE=cpu
      # Nivel de log
      - LOG_LEVEL=INFO
      # Numero de robos por time
      - N_ROBOTS_BLUE=3
      - N_ROBOTS_YELLOW=3
      # Tipo de campo (0=6vs6, 1=11vs11, 2=hardware)
      - FIELD_TYPE=1
    working_dir: /app
    command: python deploy_policy.py
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: on-failure:3
    # Limites de recursos
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  # Servico opcional para visualizacao de logs
  log-viewer:
    image: alpine:latest
    container_name: grsim_log_viewer
    volumes:
      - ./logs:/logs:ro
    command: tail -f /logs/policy.log
    profiles:
      - logs
    depends_on:
      - rl-policy
